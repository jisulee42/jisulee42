name: Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jisulee42
          config_timezone: Asia/Seoul
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          filename: github-metrics.svg
